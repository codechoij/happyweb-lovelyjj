        <section id="gift" class="page" aria-labelledby="gift-title">

              <h2 data-protected-title="gift" data-i18n="ProtectedTitle"></h2>
              <p class="timecapsule-status" data-timecapsule-status="gift" aria-live="polite"></p>
              <div class="protected-actions">
                <button class="primary-btn" type="button" data-protected-confirm="gift" data-i18n="ProtectedConfirmButton"></button>

              </div>
              <form class="protected-password-form" data-protected-form="gift" hidden>

                  <button class="primary-btn" type="button" data-gift-ready-start data-i18n="YesButton"></button>

              <div class="gift-stage" data-gift-stage></div>
              <div class="gift-capture-view" data-gift-capture-view hidden>

                  <a class="primary-btn" data-gift-download href="#" role="button" download="gift-photo.jpg" data-i18n="SavePhotoButton"></a>
                  <button class="ghost-btn" type="button" data-gift-replay data-i18n="CatchAgainButton"></button>
                  <button class="ghost-btn" type="button" data-gift-captured-close data-i18n="CloseButton"></button>
                </div>

              <div class="gift-finish-view" data-gift-finish-view hidden>

                  <button class="primary-btn" type="button" data-gift-finish-confirm data-i18n="ConfirmButton"></button>

                <div class="gift-video-heading">
                  <div>
                    <p class="eyebrow" data-i18n="NavGift"></p>
                    <h3 id="gift-video-title" data-gift-video-title data-i18n="GiftVideoOneTitle"></h3>
                  </div>
                  <button class="ghost-btn" type="button" data-gift-video-close data-i18n="ExitButton"></button>
                </div>

                  <source src="./assets/gift-videos/video%20(1).mp4" type="video/mp4" />

                <div class="gift-video-actions" data-gift-video-actions hidden>
                  <button class="primary-btn" type="button" data-gift-video-replay data-i18n="WatchAgainButton"></button>
                  <a class="ghost-btn" data-gift-video-download href="./assets/gift-videos/video%20(1).mp4" download="video (1).mp4" data-i18n="DownloadButton"></a>
                </div>
              </div>
            </div>
            <div class="gift-dud-modal" data-gift-dud-modal hidden role="dialog" aria-modal="true" aria-labelledby="gift-dud-title">

                <button class="ghost-btn gift-dud-close" type="button" data-gift-dud-close data-i18n="CloseButton"></button>

                  <h3 id="gift-dud-title" data-gift-dud-title-text data-i18n="GiftDudTitle"></h3>
                  <p data-gift-dud-message data-i18n="GiftDudMessage"></p>
                  <form class="gift-prize-form" data-gift-prize-form hidden>
                    <input data-gift-prize-input type="text" autocomplete="off" data-i18n-placeholder="GiftPrizeWishPlaceholder" />

                    <p class="gift-prize-status" data-gift-prize-status aria-live="polite"></p>
                  </form>
                  <button class="primary-btn" type="button" data-gift-dud-confirm data-i18n="ConfirmButton"></button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="letter" class="page" aria-labelledby="letter-title">
          <div class="protected-gate" data-protected-gate="letter">
            <div class="protected-card">
              <p class="eyebrow" data-i18n="ProtectedEyebrow"></p>
              <h2 data-protected-title="letter" data-i18n="ProtectedTitle"></h2>
              <p class="timecapsule-status" data-timecapsule-status="letter" aria-live="polite"></p>

                <a class="ghost-btn" href="#camera" data-i18n="TakePhotoButton"></a>
                <a class="ghost-btn" href="#guestbook" data-i18n="CelebrateButton"></a>
              </div>
              <form class="protected-password-form" data-protected-form="letter" hidden>

                  <span data-i18n="PasswordLabel"></span>
                  <input data-protected-password="letter" type="password" autocomplete="current-password" required />

          <div data-protected-content="letter" hidden>
            <div class="section-heading">
              <p class="eyebrow" data-i18n="LetterEyebrow"></p>

                <h3 data-i18n="LetterDescriptionTitle"></h3>
                <p data-i18n="LetterDescriptionBody"></p>
                <button class="primary-btn" type="button" data-letter-start data-i18n="LetterDescriptionOpenButton"></button>
              </article>

                <p class="letter-signature letter-from" data-letter-from data-i18n="LetterFrom"></p>
                <p class="letter-page-number" data-letter-page-number></p>
              </article>

              <article class="letter-paper letter-page letter-page-locked" data-letter-locked-page hidden>
                <div class="letter-locked-preview" aria-hidden="true">
                  <p class="letter-signature letter-to" data-letter-locked-to data-i18n="LetterTo"></p>
                  <p data-letter-locked-body></p>
                  <p class="letter-signature letter-from" data-letter-locked-from data-i18n="LetterFrom"></p>
                </div>
                <div class="letter-locked-message">
                  <p class="eyebrow" data-i18n="LetterLockedEyebrow"></p>
                  <h3 data-i18n="LetterLockedTitle"></h3>
                  <p data-letter-locked-release></p>

              </article>

              <div class="letter-page-actions" data-letter-actions hidden>
                <button class="ghost-btn" type="button" data-letter-prev data-i18n="LetterPreviousButton" aria-label="이전 장" title="이전 장"></button>
                <button class="primary-btn" type="button" data-letter-next data-i18n="LetterNextButton" aria-label="다음 장" title="다음 장"></button>
                <a class="ghost-btn" href="#home" data-letter-home data-i18n="LetterHomeButton"></a>
                <a class="primary-btn" data-letter-save href="#" data-i18n="LetterSaveButton" aria-label="편지 저장하기" title="편지 저장하기"></a>
              </div>
              <p class="form-status letter-status" data-letter-status aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section id="camera" class="page" aria-labelledby="camera-title">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="CameraEyebrow"></p>
            <h2 id="camera-title" data-i18n="NavCamera"></h2>
          </div>
          <div class="camera-layout">
            <div class="camera-panel">
              <video data-video autoplay playsinline muted></video>
              <div class="camera-actions">
                <button class="primary-btn" type="button" data-camera-start data-i18n="CameraStartButton"></button>
                <button class="ghost-btn" type="button" data-camera-capture data-i18n="CameraCaptureButton"></button>
              </div>
              <p class="helper-text" data-camera-status data-i18n="CameraInitialStatus"></p>
            </div>
            <div class="polaroid-result" data-polaroid-result hidden>
              <div class="polaroid" data-polaroid>
                <img data-photo alt="" data-i18n-alt="CapturedPhotoAlt" />
                <p data-polaroid-caption>
                  <span data-polaroid-date></span>
                  <span data-polaroid-copy data-i18n="PolaroidCaptionCopy"></span>
                </p>
                <a class="download-link" data-download href="#" download="our-anniversary-photo.jpg" data-i18n="SavePhotoButton"></a>
              </div>
              <div class="camera-style-panel" aria-label="" data-i18n-aria-label="PolaroidStyleLabel">
                <fieldset class="style-group">
                  <legend data-i18n="PolaroidFrameLabel"></legend>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-frame" value="classic" data-polaroid-style checked />
                    <span class="style-swatch swatch-classic" aria-hidden="true"></span>
                    <span data-i18n="PolaroidFrameClassic"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-frame" value="rose" data-polaroid-style />
                    <span class="style-swatch swatch-rose" aria-hidden="true"></span>
                    <span data-i18n="PolaroidFrameRose"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-frame" value="mint" data-polaroid-style />
                    <span class="style-swatch swatch-mint" aria-hidden="true"></span>
                    <span data-i18n="PolaroidFrameMint"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-frame" value="butter" data-polaroid-style />
                    <span class="style-swatch swatch-butter" aria-hidden="true"></span>
                    <span data-i18n="PolaroidFrameButter"></span>
                  </label>
                </fieldset>

                <fieldset class="style-group">
                  <legend data-i18n="PolaroidPatternLabel"></legend>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-pattern" value="none" data-polaroid-pattern checked />
                    <span data-i18n="PolaroidPatternNone"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-pattern" value="dots" data-polaroid-pattern />
                    <span data-i18n="PolaroidPatternDots"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-pattern" value="hearts" data-polaroid-pattern />
                    <span data-i18n="PolaroidPatternHearts"></span>
                  </label>
                </fieldset>

                <fieldset class="style-group">
                  <legend data-i18n="PolaroidFontLabel"></legend>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font" value="default" data-polaroid-font checked />
                    <span data-i18n="PolaroidFontDefault"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font" value="gamja" data-polaroid-font />
                    <span data-i18n="PolaroidFontGamja"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font" value="single" data-polaroid-font />
                    <span data-i18n="PolaroidFontSingle"></span>
                  </label>
                </fieldset>

                <fieldset class="style-group">
                  <legend data-i18n="PolaroidFontSizeLabel"></legend>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font-size" value="small" data-polaroid-font-size />
                    <span data-i18n="PolaroidFontSizeSmall"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font-size" value="medium" data-polaroid-font-size checked />
                    <span data-i18n="PolaroidFontSizeMedium"></span>
                  </label>
                  <label class="style-choice">
                    <input type="radio" name="polaroid-font-size" value="large" data-polaroid-font-size />
                    <span data-i18n="PolaroidFontSizeLarge"></span>
                  </label>
                </fieldset>
              </div>
            </div>
          </div>

                <li data-i18n="LoveNoteOne"></li>
                <li data-i18n="LoveNoteTwo"></li>
                <li data-i18n="LoveNoteThree"></li>
              </ul>
            </div>
          </div>
          <section id="guestbook" class="guestbook" aria-labelledby="guestbook-title">
